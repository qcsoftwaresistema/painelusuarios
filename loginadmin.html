<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - Q.C Software</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* Imagem de Fundo Industrial com Overlay Escuro */
        .bg-industrial {
            background-image: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                              url('/imagens/background_login.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>

</head>
<body class="bg-industrial min-h-screen flex items-center justify-center p-4"></body>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
        
        <div class="flex flex-col items-center mb-6">
            <img src="/imagens/logo.png" alt="Q.C Software Logo" class="h-20 w-auto object-contain mb-2">
            <h1 class="text-xl font-bold text-slate-800">Painel Administrativo</h1>
            <p class="text-xs text-slate-500">Informe suas credenciais para continuar</p>
        </div>

        <div id="msg-erro" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg flex items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>Usuário ou senha incorretos!</span>
        </div>

        <form id="form-login" onsubmit="autenticarAdmin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Usuário</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" id="login-usuario" required placeholder="Digite o usuário"
                        class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="login-senha" required placeholder="••••••••"
                        class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow transition-colors flex items-center justify-center gap-2 cursor-pointer mt-2">
                <i class="bi bi-box-arrow-in-right"></i> Entrar no Painel
            </button>
        </form>
    </div>

    <script>
        function autenticarAdmin(e) {
            e.preventDefault();
            
            const usuario = document.getElementById("login-usuario").value.trim();
            const senha = document.getElementById("login-senha").value.trim();
            const msgErro = document.getElementById("msg-erro");

            // Define o usuário e senha fixos de administração
            const USER_ADMIN = "fabricio.oliveira";
            const PASS_ADMIN = "Myfab@123";

            if (usuario === USER_ADMIN && senha === PASS_ADMIN) {
                // Guarda um token de sessão no navegador
                sessionStorage.setItem("qc_admin_logged", "true");
                
                // Redireciona para o painel de administração (ajuste o nome se o seu HTML principal for outro)
                window.location.href = "index.html";
            } else {
                msgErro.classList.remove("hidden");
            }
        }

        // Se já estiver logado, redireciona para a página principal direto
        if (sessionStorage.getItem("qc_admin_logged") === "true") {
            window.location.href = "index.html";
        }

    </script>
</body>
</html>
